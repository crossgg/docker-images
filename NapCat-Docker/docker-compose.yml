# ============================================================================
# NapCat 原生 SOCKS5 代理部署
#
# 依据：NapCat 源码 packages/napcat-shell/base.ts 的 handleProxy()
#   读取 NAPCAT_PROXY_ADDRESS / NAPCAT_PROXY_PORT
#   调用 session.getMSFService().setNetworkProxy({ proxyType: 2, isSocket: true })
#   即直接设置 QQ MSF 网络层代理 —— 这是 QQ 自己的协议栈代理接口
#
# 覆盖范围：QQ 登录与收发消息的核心协议流量
# 代理类型：必须是 SOCKS5（proxyType 2 在源码中硬编码，不可选 HTTP；也不支持带密码）
#
# 修改.env
# 启动：docker compose up -d
# ============================================================================

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    network_mode: bridge

    env_file:
      - .env

    ports:
      - "${OB_HTTP_PORT:-6001}:${OB_HTTP_PORT:-6001}"   # OneBot HTTP 服务端（青龙 GOBOT_URL 用这个端口）
      - "${OB_WS_PORT:-6002}:${OB_WS_PORT:-6002}"     # OneBot WebSocket
      - "${WEBUI_PORT:-6099}:6099"     # WebUI（公网部署务必改端口或加防火墙）

    volumes:
      - ./data/qq:/app/.config/QQ           # QQ 登录态，持久化后可快速登录
      - ./data/config:/app/napcat/config    # NapCat 配置
      - ./data/plugins:/app/napcat/plugins  # 插件目录

    # QQ 是 Electron 应用，共享内存给小了会崩
    shm_size: "512m"
    # MAC地址固定：
    mac_address: "${MAC:-}"
    # Docker Desktop（Windows/macOS）访问宿主机代理时需要这行；
    # Linux 上用 172.17.0.1 则不需要，留着也无害
    extra_hosts:
      - "host.docker.internal:host-gateway"

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
